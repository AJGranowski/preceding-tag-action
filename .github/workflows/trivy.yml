name: Trivy security scanner
on:
  schedule:
    - cron: "16 8 * * 6"
  push:
    branches: [ "main" ]
  pull_request:

# Declare default permissions as read only.
permissions: read-all

jobs:
  index-images:
    name: Index Images
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.images.outputs.json }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect all compose image names
        id: images
        run: echo "json=$(docker compose config --images | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: index-images
    permissions:
      contents: read          # Required to checkout and read repo files
      security-events: write  # Required to upload SARIF files to Security tab
    strategy:
      matrix:
        image: ${{ fromJSON(needs.index-images.outputs.json) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            check.trivy.dev:443
            dl-cdn.alpinelinux.org:443
            get.trivy.dev:443
            github.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443

      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://docs.docker.com/build/ci/github-actions/cache/#github-cache
      - name: Set up Docker CLI
        id: setup-buildx-action
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: trivy

      - name: Docker Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildkit-cache
          key: buildkit-${{ runner.os }}-${{ hashFiles('./container-images/**') }}

      - name: Build Docker images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          allow: |
            network.host
          builder: ${{ steps.setup-buildx-action.outputs.name }}
          load: true
          set: |
            *.cache-from=type=local,src=/tmp/buildkit-cache
            *.cache-to=type=local,dest=/tmp/buildkit-cache,mode=max
          source: .

      - name: Build an images
        run: docker compose build

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: "sarif"
          image-ref: "${{ matrix.image }}"
          limit-severities-for-sarif: true
          output: "trivy-results.sarif"
          severity: "CRITICAL"
      
      - name: "Upload artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file ${{ matrix.image }}
          path: trivy-results.sarif
          retention-days: 5

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: "trivy-results.sarif"