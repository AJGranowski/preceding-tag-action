name: Regression Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Empty inputs
            include-ref: ""
            ref: ""
            regex: ""
            repository: ""
          - name: Filter for release-* tags
            include-ref: ""
            ref: ""
            regex: ^release-(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
            repository: ""
          - name: Starting from a different commit
            include-ref: ""
            ref: 7f6f9a02a5f985b460f60b8dbe6c11294695c96f
            regex: ""
            repository: ""
          - name: Using a different repository
            include-ref: ""
            ref: ""
            regex: ""
            repository: "github/markup"

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        disable-sudo: true
        egress-policy: block
        allowed-endpoints: >
          api.github.com:443
          github.com:443

    - name: Download Bundled Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: bundle
        path: ./

    - name: Run Published Action
      id: preceding-tag-published
      uses: AJGranowski/preceding-tag-action@efde4bddc63fde7406e4683d89d475f1e61ad929 # v1.2.3
      with:
        include-ref: ${{ matrix.include-ref }}
        ref: ${{ matrix.ref }}
        regex: ${{ matrix.regex }}
        repository: ${{ matrix.repository }}

    - name: Run Local Action
      id: preceding-tag-local
      uses: ./
      with:
        include-ref: ${{ matrix.include-ref }}
        ref: ${{ matrix.ref }}
        regex: ${{ matrix.regex }}
        repository: ${{ matrix.repository }}

    - name: Expect Outputs To Be Equal
      env:
        LOCAL_ACTION_TAG: ${{ steps.preceding-tag-local.outputs.tag }}
        PUBLISHED_ACTION_TAG: ${{ steps.preceding-tag-published.outputs.tag }}
      run: |
        [ "$LOCAL_ACTION_TAG" = "$PUBLISHED_ACTION_TAG" ]